<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenWeather Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/leaflet-1.9.4/leaflet.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/vendor/leaflet-1.9.4/leaflet.js" defer></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <!--
    Esqueleto da tela (fatia 5). Os textos e valores da previsão por minuto abaixo são
    provisórios, copiados do exemplo da seção 6.3 da arquitetura. Eles saem nas fatias 10 e
    11, quando os blocos passam a ser montados pelos módulos de static/js/ui/ (guardrail 10).
  -->
  <!-- Cabeçalho: estrutura só. Os textos vêm do messages.js e do estado (ui/header.js). -->
  <header class="app-header">
    <h1 class="app-title"></h1>

    <div class="scale-toggle" role="group">
      <button type="button" class="scale-option" data-scale="c"></button>
      <button type="button" class="scale-option" data-scale="f"></button>
    </div>

    <!-- Focável para mostrar o nome completo de uma cidade longa (feature 1, categoria 10). -->
    <p class="city" tabindex="0">
      <svg class="city-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/>
      </svg>
      <span class="city-name"></span>
    </p>

    <form class="search" role="search" novalidate>
      <button type="submit" class="search-button">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <path d="m15.5 15.5 5 5"/>
        </svg>
      </button>
      <input class="search-input" type="search" name="q" role="combobox" aria-expanded="false"
             aria-controls="search-results" autocomplete="off" spellcheck="false">
      <div class="search-popup" hidden>
        <ul class="search-results" id="search-results" role="listbox"></ul>
        <p class="search-hint" hidden></p>
      </div>
      <p class="search-message" role="status"></p>
    </form>

    <!-- Aviso de localização: última linha do cabeçalho, abaixo da busca (RF-003, RN-002). -->
    <div class="location-notice" hidden>
      <p class="location-notice-text" role="status"></p>
      <button type="button" class="location-notice-close">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="dashboard">
    <!-- Abas de dias: estrutura só. As abas são criadas pelo ui/day-tabs.js. -->
    <nav class="day-tabs">
      <div class="day-tabs-list" role="tablist"></div>
    </nav>

    <div class="dashboard-row">
      <!-- Condições atuais: estrutura só. Os textos vêm do messages.js e do estado (ui/current.js). -->
      <section class="panel current">
        <!-- A ilustração do grupo de condição é o fundo do card, escolhida pelo data-condition (ADR-012). -->
        <div class="current-card">
          <p class="current-alerts" hidden>
            <svg class="current-alerts-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 3 2 20h20L12 3Zm0 6.5v4.5m0 3v.5"/>
            </svg>
            <span class="current-alerts-text"></span>
          </p>
          <p class="current-time"></p>
          <!-- Temperatura; num dia diferente de "Hoje", a máxima e a mínima (RN-030). -->
          <div class="current-main">
            <p class="current-temp"></p>
            <p class="current-min" hidden></p>
          </div>
          <div class="current-summary">
            <img class="current-icon" alt="" width="48" height="48" hidden>
            <p class="current-description"></p>
            <p class="current-feels-like"></p>
          </div>
        </div>

        <!-- Seis indicadores, na ordem do RF-020. O data-indicator é a chave do view model. -->
        <ul class="indicators">
          <li class="indicator" data-indicator="wind">
            <span class="indicator-label">
              <svg class="indicator-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"/>
              </svg>
              <span class="indicator-name"></span>
            </span>
            <span class="indicator-value"></span>
          </li>
          <li class="indicator" data-indicator="humidity">
            <span class="indicator-label">
              <svg class="indicator-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11Z"/>
              </svg>
              <span class="indicator-name"></span>
            </span>
            <span class="indicator-value"></span>
          </li>
          <li class="indicator" data-indicator="visibility">
            <span class="indicator-label">
              <svg class="indicator-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <span class="indicator-name"></span>
            </span>
            <span class="indicator-value"></span>
          </li>
          <li class="indicator" data-indicator="pressure">
            <span class="indicator-label">
              <svg class="indicator-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 18a8 8 0 1 1 16 0M12 18l4-5"/>
              </svg>
              <span class="indicator-name"></span>
            </span>
            <span class="indicator-value"></span>
          </li>
          <li class="indicator" data-indicator="uvi">
            <span class="indicator-label">
              <svg class="indicator-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
              </svg>
              <span class="indicator-name"></span>
            </span>
            <span class="indicator-value"></span>
          </li>
          <li class="indicator" data-indicator="dew_point">
            <span class="indicator-label">
              <svg class="indicator-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M10 4a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0Z"/>
              </svg>
              <span class="indicator-name"></span>
            </span>
            <span class="indicator-value"></span>
          </li>
        </ul>
      </section>

      <!--
        Previsão hora a hora: estrutura só. A curva, os pontos, as etiquetas e os cards são
        desenhados pelo ui/hourly.js, e o título vem do messages.js.
      -->
      <section class="panel hourly" aria-labelledby="hourly-title">
        <h2 class="panel-title" id="hourly-title"></h2>
        <!-- A curva e os cards rolam juntos: a curva cobre sempre as mesmas horas dos cards (RF-034, RF-037). -->
        <div class="hourly-scroll">
          <div class="hourly-track">
            <div class="hourly-chart">
              <svg class="hourly-curve" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <path/>
              </svg>
              <div class="hourly-rain" aria-hidden="true"></div>
              <div class="hourly-points"></div>
              <p class="hourly-tooltip" aria-hidden="true" hidden></p>
            </div>
            <ol class="hourly-list"></ol>
          </div>
        </div>
      </section>
    </div>

    <div class="map-section">
      <div class="map" id="map" role="region" aria-label="Mapa de precipitação centrado em Uberlândia"></div>

      <section class="panel minutely" aria-labelledby="minutely-title">
        <h2 class="panel-title" id="minutely-title">Previsão por minuto — precipitação</h2>
        <ol class="minutely-marks">
          <li class="mark"><span class="mark-label">Agora</span><span class="mark-time">08:18</span></li>
          <li class="mark"><span class="mark-label">15 min</span><span class="mark-time">08:33</span></li>
          <li class="mark"><span class="mark-label">30 min</span><span class="mark-time">08:48</span></li>
          <li class="mark"><span class="mark-label">45 min</span><span class="mark-time">09:03</span></li>
          <li class="mark"><span class="mark-label">60 min</span><span class="mark-time">09:18</span></li>
        </ol>
        <div class="minutely-bars">
          <span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span>
          <span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-moderate"></span><span class="bar band-moderate"></span><span class="bar band-moderate"></span><span class="bar band-moderate"></span><span class="bar band-moderate"></span>
          <span class="bar band-moderate"></span><span class="bar band-moderate"></span><span class="bar band-heavy"></span><span class="bar band-heavy"></span><span class="bar band-heavy"></span><span class="bar band-extreme"></span><span class="bar band-extreme"></span><span class="bar band-heavy"></span><span class="bar band-heavy"></span><span class="bar band-moderate"></span>
          <span class="bar band-moderate"></span><span class="bar band-moderate"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span>
          <span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-light"></span><span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span>
          <span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span><span class="bar band-none"></span>
        </div>
        <p class="minutely-summary">Chuva agora, parando por volta de 09:02.</p>
        <ul class="minutely-legend">
          <li class="legend-item"><span class="legend-swatch band-none"></span>0 mm/h</li>
          <li class="legend-item"><span class="legend-swatch band-light"></span>até 0,5 mm/h</li>
          <li class="legend-item"><span class="legend-swatch band-moderate"></span>0,5 a 2,5 mm/h</li>
          <li class="legend-item"><span class="legend-swatch band-heavy"></span>2,5 a 7,5 mm/h</li>
          <li class="legend-item"><span class="legend-swatch band-extreme"></span>acima de 7,5 mm/h</li>
        </ul>
      </section>
    </div>
  </main>
</body>
</html>
