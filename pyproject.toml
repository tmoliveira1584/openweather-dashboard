# Só configuração de ferramentas (pytest, ruff e coverage). O projeto não é um pacote instalável.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: testes de ponta a ponta no Chrome instalado (pytest-playwright)",
    "live: fumaça com o provedor real; usa a cota e roda só manualmente",
]
addopts = "-m 'not live' --browser-channel chrome"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.coverage.run]
# coverage run -m pytest: mede app/, inclusive o backend que os testes e2e sobem numa thread.
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
